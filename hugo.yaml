baseURL: "https://xn--mark-oc2g.tw/"
languageCode: "zh-tw"
hasCJKLanguage: true
title: "Mark"
theme: ["PaperMod"]

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 8

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  title: "Mark"
  description: "Mark 的資安筆記：CTF、Web / AI security、活動心得。"
  keywords:
    - Cybersecurity
    - Programming
    - CTF
    - Linux
    - Docker
    - Projects
  author: "Mark"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  hideAuthor: true
  DateFormat: "2006-01-02"
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: false
  tocopen: false
  hidemeta: false
  hideSummary: false

  spotify:
    # Cloudflare Worker URL, e.g. https://mark-spotify.YOUR-SUBDOMAIN.workers.dev/now-playing
    # Empty hides the card until the backend is connected.
    endpoint: ""

  homeInfoParams:
    # Put a photo at static/images/avatar.jpg and set Avatar: "/images/avatar.jpg" to show it.
    Avatar: ""
    Title: "Mark"
    Content: "正在學資安的學生。這裡放 CTF 解題、參加活動的心得，還有學東西時順手記下來的筆記。"
    Topics:
      - web security
      - ai security
      - ctf

  socialIcons:
    - name: github
      url: "https://github.com/qnianjun"

  assets:
    disableHLJS: true

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/qnianjun/qnianjun.github.io/tree/main/content"
    Text: "Edit this page"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.35
    minMatchCharLength: 2
    keys:
      - title
      - permalink
      - summary
      - content
      - tags
      - categories

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 10

    - identifier: tags
      name: tags
      url: /tags/
      weight: 20

    - identifier: about
      name: about
      url: /about/
      weight: 30

    - identifier: search
      name: search
      url: /search/
      weight: 40

markup:
  highlight:
    noClasses: false
    lineNos: true
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    style: monokai
