{{- if eq .Section "posts" }}
<div class="reading-progress" data-reading-progress role="progressbar" aria-label="閱讀進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div>
<div class="post-end">
    <span class="post-end-mark" aria-hidden="true">EOF</span>
    <button class="copy-article" type="button" data-copy-article hidden>複製連結</button>
    <span class="copy-status" data-copy-status role="status"></span>
</div>
{{- end }}
