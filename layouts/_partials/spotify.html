{{- with site.Params.spotify.endpoint }}
<section class="music-card" data-now-playing data-endpoint="{{ . }}" aria-label="Mark 的 Spotify 動態">
    <div class="music-art">
        <span class="music-placeholder" aria-hidden="true">♫</span>
        <img data-music-image hidden width="120" height="120" alt="" referrerpolicy="no-referrer">
    </div>
    <div class="music-info">
        <div aria-live="polite" aria-atomic="true">
            <p class="music-status"><span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span><span data-music-status>Spotify</span></p>
            <h3 data-music-title>…</h3>
            <p class="music-artist" data-music-artist></p>
        </div>
        <div class="music-progress" data-music-progress hidden>
            <div class="music-track" aria-hidden="true"><span data-music-bar></span></div>
            <p class="music-time"><span data-music-elapsed>0:00</span> / <span data-music-duration>0:00</span></p>
        </div>
        <a class="music-link" data-music-link href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">開啟 Spotify</a>
    </div>
    <noscript><p class="music-note">開啟 JavaScript 即可查看音樂動態。</p></noscript>
</section>
{{- $script := resources.Get "js/now-playing.js" | resources.Minify | fingerprint }}
<script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous"></script>
{{- end }}
